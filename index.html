<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="speedforge-verification" content="RQbNWhNgjZI9NL4mn4k7MXjQ">
    <title>Jarin Atelier | Luxury Islamic Calligraphy & Custom Art</title>

    <!-- Small icons (the old 738 KB logo PNG was being downloaded as the favicon) -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fetch the main (LCP) hero image first, at the same size the <img> will pick -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/assets/art-01-640.webp"
      imagesrcset="/assets/art-01-640.webp 585w, /assets/art-01.webp 1199w"
      imagesizes="(max-width: 640px) 340px, (max-width: 1024px) 380px, 420px"
      fetchpriority="high"
    />

    <!-- Fonts: connect early and load without blocking first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Jost:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Jost:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
